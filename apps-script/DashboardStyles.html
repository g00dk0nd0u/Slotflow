<style>
  :root { color-scheme: light; font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif; color: #17211b; background: #f3f5f1; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #f3f5f1; }
  .dashboard { max-width: 1280px; margin: auto; padding: clamp(20px, 3vw, 42px); }
  .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
  p { margin: 0; }
  .date { font-size: clamp(16px, 2vw, 22px); color: #536057; }
  .clock { font-size: clamp(34px, 5vw, 58px); font-weight: 700; letter-spacing: -.04em; }
  .status-wrap { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }
  .status { padding: 7px 13px; border-radius: 999px; font-weight: 700; background: #d9eee1; color: #126038; }
  .status-loading, .status-stale { background: #fff0c7; color: #795500; }
  .status-error { background: #f9d8d3; color: #8a2920; }
  .updated { color: #667169; font-size: 13px; }
  button { border: 1px solid #cbd2cc; border-radius: 9px; padding: 7px 12px; background: #fff; color: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .hero { border-radius: 22px; padding: clamp(24px, 4vw, 48px); background: #174e36; color: white; min-height: 230px; display: flex; flex-direction: column; justify-content: center; box-shadow: 0 10px 30px #193d2b1f; }
  .eyebrow { opacity: .8; font-weight: 700; }
  .hero-time { margin-top: 12px; font-size: clamp(38px, 7vw, 76px); font-weight: 750; letter-spacing: -.05em; }
  h1 { margin: 4px 0 0; font-size: clamp(26px, 4vw, 46px); line-height: 1.2; }
  .hero-date { margin-top: 10px; opacity: .8; }
  .all-day { margin-top: 18px; padding: 13px 18px; border-left: 5px solid #9a6b12; border-radius: 8px; background: #fff4d9; font-weight: 700; }
  .columns { display: grid; grid-template-columns: 1.25fr 1fr; gap: 20px; margin-top: 20px; }
  .panel { background: white; border-radius: 18px; padding: 22px; min-height: 210px; }
  .panel-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h2 { margin: 0 0 14px; font-size: 21px; }
  .list { display: grid; gap: 4px; }
  .row { display: grid; grid-template-columns: 130px 1fr; gap: 16px; padding: 13px 4px; border-top: 1px solid #edf0ed; }
  .row:first-child { border-top: 0; }
  .row-time { font-variant-numeric: tabular-nums; font-weight: 700; }
  .ongoing { color: #17633e; font-size: 12px; margin-left: 7px; }
  .empty { padding: 18px 4px; color: #768078; }
  .next-gap { color: #17633e; font-weight: 700; font-size: 13px; }
  @media (max-width: 720px) { .columns { grid-template-columns: 1fr; } .topbar { align-items: center; } .updated { width: 100%; text-align: right; } }
</style>
