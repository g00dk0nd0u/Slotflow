<!doctype html>
<html lang="ja"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#151515;background:#fff}*{box-sizing:border-box}body{margin:0;background:#fff}.wrap{max-width:480px;margin:auto;padding:0 24px 38px}.hero{position:relative;overflow:hidden;margin:0 -24px 22px;padding:54px 34px 30px;background:linear-gradient(105deg,#f7f0e7cc,#fffaf2b8),radial-gradient(circle at 82% 16%,#8ba878 0 5%,transparent 6%),radial-gradient(circle at 88% 45%,#aec09b 0 7%,transparent 8%),linear-gradient(90deg,#e9ddcf,#f8f4eb 55%,#dfe6d4);isolation:isolate}.hero:before,.hero:after{content:"";position:absolute;z-index:-1;filter:blur(12px);opacity:.55}.hero:before{width:150px;height:100px;right:-16px;bottom:-30px;border-radius:70% 20%;background:#87a777;transform:rotate(-18deg)}.hero:after{width:180px;height:68px;left:42%;bottom:10px;border-radius:50%;background:#d9c9b5}.hero h1{font-family:Georgia,"Yu Mincho",serif;font-size:40px;font-weight:400;letter-spacing:.02em;margin:0 0 9px;color:#463e37}.tagline{font-family:"Yu Mincho",serif;font-size:13px;letter-spacing:.12em;margin:0;color:#665c54}.tagline:before{content:"—";margin-right:16px}.selectors{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;margin-bottom:28px}.selector{position:relative}.selector:after{content:"";position:absolute;right:17px;top:50%;width:9px;height:9px;border-right:2px solid #3f4650;border-bottom:2px solid #3f4650;transform:translateY(-70%) rotate(45deg);pointer-events:none}select{appearance:none;width:100%;height:58px;border:1px solid #d1d6dc;border-radius:9px;background:#fff;padding:0 40px 0 17px;font:inherit;font-size:18px;color:#111}.calendar{margin:0}.month{margin-bottom:22px}.month-title{font-size:20px;font-weight:500;margin:0 0 13px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}.week{font-size:14px;color:#69727f;margin-bottom:7px}.day{min-height:61px;border:0;background:none;border-radius:9px;font:inherit;padding:7px 1px;color:#171717}.day span,.day small{display:block}.day span{font-size:16px;line-height:20px;margin-bottom:7px}.day small{font-size:24px;line-height:20px;font-weight:400}.day.status-open small{color:#098735}.day.status-limited small{color:#eb8a00}.day.status-closed small{color:#87909b}.day.selected{background:#f0f2f3}.day:disabled{color:#b9bec4}.day:disabled small{color:#c8cdd1}.expand{display:block;width:50px;height:38px;margin:-10px auto 4px;border:0;background:none;position:relative}.expand:after{content:"";position:absolute;left:18px;top:9px;width:12px;height:12px;border-right:2px solid #66707d;border-bottom:2px solid #66707d;transform:rotate(45deg)}.expand[hidden]{display:none}.details{border-top:1px solid #d8dde1;padding-top:25px}.selected-date{font-size:28px;line-height:1.2;margin:0 0 28px;font-weight:700}.details-label{font-size:17px;margin:0 0 10px}.ranges{list-style:none;padding:0;margin:0 0 25px}.ranges li{font-family:Georgia,"Yu Mincho",serif;font-size:27px;line-height:1.45}.ranges li.message{font-family:inherit;font-size:15px;color:#727b87}.note{color:#727b87;font-size:13px;line-height:1.55;margin:0 0 28px}.error{color:#a12d2d;font-size:14px}.cta a{display:flex;align-items:center;justify-content:center;gap:12px;text-decoration:none;background:#349a5f;color:#fff;padding:17px;border-radius:11px;font-size:19px;font-weight:700}.cta svg{width:22px;height:22px;fill:currentColor}.cta a.disabled{pointer-events:none;opacity:.45}@media(max-width:360px){.wrap{padding-left:18px;padding-right:18px}.hero{margin-left:-18px;margin-right:-18px}.selectors{gap:8px}select{font-size:16px;padding-left:12px}.selected-date{font-size:25px}}
</style></head><body><main class="wrap"><header class="hero"><h1 id="store">空き状況</h1><p class="tagline">髪から、いつもの私を少し好きに。</p></header>
<div class="selectors"><div class="selector"><select id="service" aria-label="サービス"></select></div><div class="selector"><select id="style" aria-label="髪の長さ"><option value="medium">ミディアム</option></select></div></div>
<section class="calendar" aria-label="空き状況"><div id="months"></div><button id="expand" class="expand" type="button" aria-label="次の14日間を表示"></button></section>
<section class="details"><h2 id="selectedDate" class="selected-date">日付を選択してください</h2><p class="details-label">開始可能時間</p><ul id="ranges" class="ranges"><li class="message">カレンダーから日付を選択してください</li></ul><p class="note">※ 表示の時間内でも、施術内容によりご案内できない場合があります。</p><p id="error" class="error" aria-live="polite"></p><div class="cta"><a id="phone" class="disabled" aria-disabled="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6.6 10.8a15.5 15.5 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.2 1.2.4 2.5.7 3.8.7.6 0 1 .4 1 1v3.6c0 .6-.4 1-1 1A17.3 17.3 0 0 1 3 4c0-.6.4-1 1-1h3.7c.6 0 1 .4 1 1 0 1.3.2 2.6.7 3.8.1.4 0 .8-.3 1.1z"/></svg><span>電話で確認する</span></a></div></section>
</main><script>(function(){'use strict';var service=document.getElementById('service'),months=document.getElementById('months'),ranges=document.getElementById('ranges'),selectedDate=document.getElementById('selectedDate'),error=document.getElementById('error'),expand=document.getElementById('expand'),phone=document.getElementById('phone');var today='',limit='',windowStart='',visibleDays=14,selected='',sequence=0,dayData={};
function call(method,arg,done,failed){var run=google.script.run.withSuccessHandler(done).withFailureHandler(failed||fail);if(arg===undefined)run[method]();else run[method](arg)}
function dateAdd(value,amount){var p=value.split('-').map(Number),date=new Date(Date.UTC(p[0],p[1]-1,p[2]+amount));return date.getUTCFullYear()+'-'+String(date.getUTCMonth()+1).padStart(2,'0')+'-'+String(date.getUTCDate()).padStart(2,'0')}
function mondayOf(value){var p=value.split('-').map(Number),day=new Date(Date.UTC(p[0],p[1]-1,p[2])).getUTCDay();return dateAdd(value,-((day+6)%7))}
function resetDetails(message){selected='';selectedDate.textContent='日付を選択してください';ranges.innerHTML='<li class="message">'+(message||'カレンダーから日付を選択してください')+'</li>'}
function fail(){error.textContent='空き状況を取得できません。時間をおいて更新してください';months.textContent='';expand.hidden=true;resetDetails('表示できません')}
function statusClass(status){return status==='○'?' status-open':status==='△'?' status-limited':' status-closed'}
function render(){months.textContent='';var end=dateAdd(windowStart,visibleDays-1),cursor=windowStart;while(cursor<=end&&cursor<=limit){var key=cursor.slice(0,7),group=document.createElement('section'),title=document.createElement('h2'),week=document.createElement('div'),grid=document.createElement('div'),p=cursor.split('-').map(Number),offset=(new Date(Date.UTC(p[0],p[1]-1,p[2])).getUTCDay()+6)%7;group.className='month';title.className='month-title';title.textContent=p[0]+'年'+p[1]+'月';week.className='week';['月','火','水','木','金','土','日'].forEach(function(label){var item=document.createElement('span');item.textContent=label;week.appendChild(item)});grid.className='days';for(var blank=0;blank<offset;blank++)grid.appendChild(document.createElement('span'));while(cursor<=end&&cursor<=limit&&cursor.slice(0,7)===key){var parts=cursor.split('-').map(Number),data=dayData[cursor],button=document.createElement('button');button.type='button';button.className='day'+(data?statusClass(data.status):'')+(cursor===selected?' selected':'');button.disabled=cursor<today||!data;button.innerHTML='<span>'+parts[2]+'</span><small>'+(data?data.status:'')+'</small>';button.setAttribute('aria-label',cursor+' '+(data?data.status:''));button.onclick=selectDate.bind(null,cursor);grid.appendChild(button);cursor=dateAdd(cursor,1)}group.appendChild(title);group.appendChild(week);group.appendChild(grid);months.appendChild(group)}expand.hidden=dateAdd(windowStart,visibleDays)>limit||visibleDays>=28}
function formatSelectedDate(date){var parts=date.split('-').map(Number),weekdays=['日','月','火','水','木','金','土'];return parts[1]+'月'+parts[2]+'日（'+weekdays[new Date(Date.UTC(parts[0],parts[1]-1,parts[2])).getUTCDay()]+'）'}
function selectDate(date){selected=date;render();selectedDate.textContent=formatSelectedDate(date);ranges.textContent='';var values=dayData[date].ranges;if(!values.length){ranges.innerHTML='<li class="message">開始可能時間はありません</li>';return}values.forEach(function(value){var item=document.createElement('li');item.textContent=value;ranges.appendChild(item)})}
function load(){var requestedEnd=dateAdd(windowStart,visibleDays-1),request={startDate:windowStart<today?today:windowStart,endDate:requestedEnd>limit?limit:requestedEnd,serviceId:service.value},current=++sequence;error.textContent='';dayData={};months.textContent='読み込み中…';resetDetails();call('getAvailability',request,function(response){if(current!==sequence||request.serviceId!==service.value)return;if(!response.ok){fail();return}response.days.forEach(function(day){dayData[day.date]=day});render()},function(){if(current===sequence)fail()})}
expand.onclick=function(){visibleDays=28;load()};service.onchange=function(){visibleDays=14;load()};
call('getAvailabilityOptions',undefined,function(response){if(!response.ok){fail();return}document.getElementById('store').textContent=response.storeName;phone.href=response.phoneHref;phone.className='';phone.setAttribute('aria-disabled','false');today=response.storeLocalDate;limit=response.availabilityHorizonEndDate;windowStart=mondayOf(today);response.services.forEach(function(item){var option=document.createElement('option');option.value=item.id;option.textContent=item.name;service.appendChild(option)});if(response.services.length)service.value=response.services[0].id;load()},fail)})();</script></body></html>
