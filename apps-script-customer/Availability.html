<!doctype html>
<html lang="ja"><head><base target="_top"><meta charset="utf-8"><style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#17352a;background:#f3f7f4}*{box-sizing:border-box}body{margin:0}.wrap{max-width:480px;margin:auto;padding:22px 16px 112px}header{text-align:center;margin-bottom:22px}h1{font-size:25px;margin:4px}h2{font-size:18px;margin:24px 0 10px}label{display:block;font-weight:700;margin-bottom:7px}select{width:100%;font:inherit;padding:12px;border:1px solid #b7c7bd;border-radius:10px;background:#fff}.calendar{background:#fff;border-radius:14px;padding:12px;box-shadow:0 2px 12px #17352a12}.month-head{display:flex;align-items:center;justify-content:space-between}.month-head button{border:0;background:none;font-size:23px;color:#17633e;padding:6px 12px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}.week{font-size:12px;color:#68766f;margin:8px 0}.day{min-height:49px;border:0;background:none;border-radius:8px;font:inherit;padding:4px 1px}.day span{display:block;font-size:17px;line-height:17px}.day small{font-weight:700}.day.selected{background:#dcece3}.day:disabled{color:#b2bbb6}.legend{text-align:right;font-size:12px;color:#68766f;margin:8px 2px 0}.selected-date{font-weight:700}.ranges{list-style:none;padding:0;margin:0}.ranges li{background:#fff;border-radius:10px;padding:13px 16px;margin:8px 0;font-size:19px}.message{color:#68766f}.error{color:#a12d2d}.cta{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(480px,100%);padding:14px 16px max(14px,env(safe-area-inset-bottom));background:#f3f7f4}.cta a{display:block;text-align:center;text-decoration:none;background:#17633e;color:#fff;padding:16px;border-radius:12px;font-size:20px;font-weight:700}.cta a.disabled{pointer-events:none;opacity:.45}
</style></head><body><main class="wrap"><header><h1 id="store">空き状況</h1><div id="timezone" class="message"></div></header>
<label for="service">サービス</label><select id="service"></select>
<h2>空き状況カレンダー</h2><section class="calendar"><div class="month-head"><button id="previous" type="button" aria-label="前の月">‹</button><strong id="month"></strong><button id="next" type="button" aria-label="次の月">›</button></div><div class="week"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div id="days" class="days"></div><p class="legend">○ 3枠以上　△ 1–2枠　× 空きなし</p></section>
<h2 id="selectedDate" class="selected-date">日付を選択してください</h2><h2>開始可能時間</h2><ul id="ranges" class="ranges"><li class="message">カレンダーから日付を選択してください</li></ul><p id="error" class="error" aria-live="polite"></p></main>
<div class="cta"><a id="phone" class="disabled" aria-disabled="true">電話で確認する</a></div>
<script>(function(){'use strict';var service=document.getElementById('service'),days=document.getElementById('days'),monthLabel=document.getElementById('month'),ranges=document.getElementById('ranges'),selectedDate=document.getElementById('selectedDate'),error=document.getElementById('error'),previous=document.getElementById('previous'),next=document.getElementById('next'),phone=document.getElementById('phone');var today='',limit='',view='',selected='',sequence=0,dayData={};
function call(method,arg,done,failed){var run=google.script.run.withSuccessHandler(done).withFailureHandler(failed||fail);if(arg===undefined)run[method]();else run[method](arg)}
function fail(){error.textContent='空き状況を取得できません。時間をおいて更新してください';days.textContent='';ranges.innerHTML='<li class="message">表示できません</li>'}
function monthBounds(value){var parts=value.split('-').map(Number),last=new Date(Date.UTC(parts[0],parts[1],0)).getUTCDate();return {start:value+'-01',end:value+'-'+String(last).padStart(2,'0')}}
function render(){var bounds=monthBounds(view),first=new Date(bounds.start+'T00:00:00Z');monthLabel.textContent=first.getUTCFullYear()+'年 '+(first.getUTCMonth()+1)+'月';days.textContent='';for(var blank=0;blank<first.getUTCDay();blank++)days.appendChild(document.createElement('span'));var total=Number(bounds.end.slice(-2));for(var number=1;number<=total;number++){var date=view+'-'+String(number).padStart(2,'0'),data=dayData[date],button=document.createElement('button');button.type='button';button.className='day'+(date===selected?' selected':'');button.disabled=date<today||date>limit||!data;button.innerHTML='<span>'+number+'</span><small>'+(data?data.status:'')+'</small>';button.setAttribute('aria-label',date+' '+(data?data.status:''));button.onclick=selectDate.bind(null,date);days.appendChild(button)}previous.disabled=view<=today.slice(0,7);next.disabled=view>=limit.slice(0,7)}
function selectDate(date){selected=date;render();selectedDate.textContent=date.replace(/-/g,' / ');ranges.textContent='';var values=dayData[date].ranges;if(!values.length){ranges.innerHTML='<li class="message">開始可能時間はありません</li>';return}values.forEach(function(value){var item=document.createElement('li');item.textContent=value;ranges.appendChild(item)})}
function load(){var bounds=monthBounds(view),request={startDate:bounds.start<today?today:bounds.start,endDate:bounds.end>limit?limit:bounds.end,serviceId:service.value},current=++sequence;error.textContent='';days.textContent='読み込み中…';call('getAvailability',request,function(response){if(current!==sequence||request.serviceId!==service.value)return;if(!response.ok){fail();return}dayData={};response.days.forEach(function(day){dayData[day.date]=day});if(selected&&!dayData[selected]){selected='';selectedDate.textContent='日付を選択してください';ranges.innerHTML='<li class="message">カレンダーから日付を選択してください</li>'}render()},function(){if(current===sequence)fail()})}
function move(delta){var p=view.split('-').map(Number),date=new Date(Date.UTC(p[0],p[1]-1+delta,1));view=date.getUTCFullYear()+'-'+String(date.getUTCMonth()+1).padStart(2,'0');selected='';load()}
previous.onclick=function(){move(-1)};next.onclick=function(){move(1)};service.onchange=function(){selected='';load()};
call('getAvailabilityOptions',undefined,function(response){if(!response.ok){fail();return}document.getElementById('store').textContent=response.storeName;document.getElementById('timezone').textContent=response.timezone;phone.href=response.phoneHref;phone.className='';phone.setAttribute('aria-disabled','false');today=response.storeLocalDate;limit=response.availabilityHorizonEndDate;view=today.slice(0,7);response.services.forEach(function(item){var option=document.createElement('option');option.value=item.id;option.textContent=item.name+'（'+item.durationMinutes+'分）';service.appendChild(option)});load()},fail)})();</script></body></html>
