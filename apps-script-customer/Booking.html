<!doctype html>
<html lang="ja"><head><base target="_top"><meta charset="utf-8"><style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#18352a;background:#f4f7f5}*{box-sizing:border-box}body{margin:0}.wrap{max-width:480px;margin:auto;padding:24px 18px 48px}h1{font-size:26px}label{display:block;font-weight:700;margin:20px 0 7px}select,input,button{width:100%;font:inherit;padding:13px;border:1px solid #bdc9c2;border-radius:10px;background:#fff}button{margin-top:22px;background:#17633e;color:#fff;border:0;font-weight:700}button:disabled{opacity:.5}.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.times button{margin:0;background:#fff;color:#17633e;border:1px solid #9ab5a5}.times button.chosen{background:#17633e;color:#fff}.muted{color:#66756d}.result{padding:16px;border-radius:10px;background:#fff;margin-top:20px} [hidden]{display:none}
</style></head><body><main class="wrap"><h1>ご予約</h1><p class="muted">サービス、日付、時間を選択してください。</p>
<label for="service">サービス</label><select id="service"></select>
<label for="date">日付</label><input id="date" type="date">
<label>空き時間</label><div id="times" class="times"><span class="muted">日付を選択してください</span></div>
<label for="name">お名前（必須）</label><input id="name" maxlength="80" autocomplete="name">
<label for="contact">連絡先（任意）</label><input id="contact" maxlength="200" autocomplete="email">
<button id="confirm" disabled>予約内容を確認して確定</button><div id="result" class="result" aria-live="polite" hidden></div></main>
<script>(function(){'use strict';var service=document.getElementById('service'),date=document.getElementById('date'),times=document.getElementById('times'),name=document.getElementById('name'),contact=document.getElementById('contact'),confirm=document.getElementById('confirm'),result=document.getElementById('result'),selected='',timezone='',pendingRequestId=null;
function call(method,arg,done,failed){var run=google.script.run.withSuccessHandler(done).withFailureHandler(failed||function(){show('通信に失敗しました。もう一度お試しください');});if(arg===undefined)run[method]();else run[method](arg)}
function show(text){result.hidden=false;result.textContent=text;confirm.disabled=false}function clock(iso){return new Intl.DateTimeFormat('ja-JP',{timeZone:timezone,hour:'2-digit',minute:'2-digit'}).format(new Date(iso))}function requestId(){if(crypto.randomUUID)return crypto.randomUUID();var bytes=new Uint8Array(16);crypto.getRandomValues(bytes);return Array.prototype.map.call(bytes,function(value){return value.toString(16).padStart(2,'0')}).join('')}
function load(){selected='';confirm.disabled=true;times.textContent='読み込み中…';call('getAvailability',{date:date.value,serviceId:service.value},function(res){times.textContent='';if(!res.ok){show(res.error.message);return}if(!res.slots.length){times.textContent='空き時間がありません';return}res.slots.forEach(function(slot){var b=document.createElement('button');b.type='button';b.textContent=clock(slot.start);b.onclick=function(){Array.prototype.forEach.call(times.children,function(x){x.className=''});b.className='chosen';selected=slot.start;confirm.disabled=false};times.appendChild(b)})})}
date.onchange=load;service.onchange=function(){if(date.value)load()};confirm.onclick=function(){if(!selected||!name.value.trim())return show('お名前と時間を確認してください');if(!window.confirm(date.value+' '+clock(selected)+' で予約を確定しますか？'))return;confirm.disabled=true;pendingRequestId=pendingRequestId||requestId();call('createBooking',{serviceId:service.value,start:selected,name:name.value,contact:contact.value,requestId:pendingRequestId},function(res){pendingRequestId=null;if(res.ok){show('予約が確定しました。ありがとうございます。');date.disabled=service.disabled=name.disabled=contact.disabled=confirm.disabled=true}else show(res.error.message)},function(){show('通信結果を確認できませんでした。同じ内容で再試行してください')})};
call('getBookingOptions',undefined,function(res){if(!res.ok)return show(res.error.message);timezone=res.timezone;date.min=res.storeLocalDate;date.max=res.bookingHorizonEndDate;res.services.forEach(function(item){var o=document.createElement('option');o.value=item.id;o.textContent=item.name;service.appendChild(o)})})})();</script></body></html>
